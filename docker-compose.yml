services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afribasket
      POSTGRES_PASSWORD: afribasket
      POSTGRES_DB: afribasket
    ports:
      - "5432:5432"
    volumes:
      - afribasket_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afribasket -d afribasket"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  afribasket_pg:
